name: CI

# Runs on every push to main and every pull request. This is the gate the release
# workflow depends on: nothing gets signed that has not been tested and packaged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: the only dependency with an install script that matters is
      # playwright, whose postinstall downloads ~400 MB of browsers. Those are used by
      # tools/ (the Billingo capture crawlers), never by the tests, so CI has no use
      # for them. fsevents is the only other install-script package and is macOS-only.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # Building here, not only at release time, is what stops a payload defect from
      # surfacing when someone finally tries to ship. The build validates the manifest,
      # the referenced assets and the shard/index consistency.
      - name: Build packages
        run: npm run package

      # Mozilla's own validator. AMO runs it before signing, so a warning here would be
      # a signing failure later.
      - name: Lint the Firefox payload
        run: npm run lint:ext

      # Handy on a pull request: download and load the folder without building locally.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
