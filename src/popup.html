<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translator for Billingo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bt-header">
    <img src="../icons/icon48.png" alt="" class="bt-logo">
    <div class="bt-title">
      <span class="bt-title-1">Translator</span>
      <span class="bt-title-2">for Billingo</span>
    </div>
  </header>

  <section class="bt-langs" role="radiogroup" aria-label="Translation language">
    <button type="button" class="bt-lang" role="radio" data-lang="hu" aria-checked="false" tabindex="-1">
      <span class="bt-check" aria-hidden="true">✓</span>
      <span class="bt-lang-label">HU</span>
      <span class="bt-lang-hint">(off)</span>
    </button>
    <button type="button" class="bt-lang" role="radio" data-lang="en" aria-checked="false" tabindex="-1">
      <span class="bt-check" aria-hidden="true">✓</span>
      <span class="bt-lang-label">EN</span>
    </button>
    <button type="button" class="bt-lang" role="radio" data-lang="fr" aria-checked="false" tabindex="-1">
      <span class="bt-check" aria-hidden="true">✓</span>
      <span class="bt-lang-label">Français</span>
    </button>
  </section>

  <section class="bt-coverage">
    <div class="bt-coverage-row">
      <span class="bt-coverage-label">Coverage</span>
      <span class="bt-coverage-nums">
        <span class="bt-coverage-pct" id="bt-coverage-pct">—</span>
        <span class="bt-miss-count" id="bt-miss-count" hidden></span>
      </span>
    </div>
    <div class="bt-bar" aria-hidden="true">
      <div class="bt-bar-fill" id="bt-bar-fill" style="width:0%"></div>
    </div>
    <div class="bt-coverage-sub" id="bt-coverage-sub">Open a Billingo tab to translate.</div>
  </section>

  <!-- Export of the untranslated strings seen on this tab: the only feedback
       loop from real usage back into dict/{en,fr}.json. -->
  <section class="bt-export" aria-labelledby="bt-export-title">
    <h2 class="bt-export-title" id="bt-export-title">Untranslated strings</h2>
    <div class="bt-actions">
      <button type="button" class="bt-btn bt-btn-primary" id="bt-copy"
              title="Copy to the clipboard, one string per line" disabled>Copy untranslated</button>
      <button type="button" class="bt-btn" id="bt-download"
              aria-label="Download untranslated strings as JSON"
              title="Save the list as a JSON file" disabled>Download</button>
    </div>
    <!-- Why the buttons are disabled; hidden while there is something to export. -->
    <p class="bt-export-hint" id="bt-export-hint">Nothing to export — no Billingo tab here.</p>
    <p class="bt-export-warn" id="bt-export-truncated" hidden>List truncated — some untranslated strings were left out.</p>
    <!-- Live region: copy/download result. Never left silent on failure. -->
    <p class="bt-export-status" id="bt-export-status" role="status" aria-live="polite"></p>
  </section>

  <!-- The version is filled in from the manifest at runtime: a number hardcoded
       here drifts silently the first time someone forgets to update it. -->
  <footer class="bt-footer"><span id="bt-version"></span>Unofficial extension</footer>

  <script src="popup.js"></script>
</body>
</html>
